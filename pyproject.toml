[build-system]
requires = ["hatchling>=1.27"]  # 1.27: first release with full PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "exostab"
dynamic = ["version"]
description = "Is this planetary system dynamically stable? Honest, traceable stability indicators for known exoplanet systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mehmet Öz", email = "mehmet@mehmet-oz.com" }]
keywords = ["exoplanets", "orbital stability", "celestial mechanics", "n-body", "REBOUND", "MEGNO", "AMD"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "rebound>=5.2,<6",
    "numpy>=1.24",
    "astropy>=5.3",
    "astroquery>=0.4.7",
    "pydantic>=2.11,<3",  # older pydantic writes a different JSON schema than the shipped report.schema.json
    "typer>=0.16",  # older typer fails on `str | None` options or with click >= 8.2 (tested 2026-10-03)
    "rich>=13.0",
    "matplotlib>=3.7",
    "platformdirs>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
catalog = ["pyarrow>=14"]
web = ["streamlit>=1.50", "plotly>=6"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.5",
    "types-PyYAML",
    "pyarrow>=14",
    "streamlit>=1.50",
    "plotly>=6",
    "mkdocs>=1.6,<2",  # MkDocs 2.0 drops plugin/theme compatibility (Material for MkDocs warning, 2026)
    "mkdocs-material>=9.5",
]

[project.scripts]
exostab = "exostab.cli:app"

[project.urls]
Homepage = "https://github.com/mimitoz62/exostab"
Documentation = "https://github.com/mimitoz62/exostab#readme"
Issues = "https://github.com/mimitoz62/exostab/issues"
Changelog = "https://github.com/mimitoz62/exostab/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/exostab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/exostab"]

[tool.hatch.build.targets.sdist]
include = ["src/exostab", "tests", "examples", "README.md", "LICENSE", "CITATION.cff", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: long validation integrations (run nightly with `pytest -m slow`)",
    "network: needs the NASA Exoplanet Archive to be reachable",
]
filterwarnings = ["error::DeprecationWarning:exostab.*"]

[tool.coverage.run]
source = ["exostab"]
branch = true
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "NPY"]
ignore = [
    "N802", "N803", "N806",  # physics names (P, M, G) are clearer than snake_case here
    "RUF001", "RUF002", "RUF003",  # Greek letters and symbols in strings and comments are intentional
    "SIM300",  # false positives with pytest.approx
    "PT018",  # composite assertions are fine in tests
    "E501",  # line length is enforced by `ruff format`; long strings and formulas in docstrings are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B905"]

[tool.mypy]
# python_version is left at the running interpreter: recent numpy stubs use syntax that mypy only accepts
# when checking for Python >= 3.12, and CI runs mypy on every supported version.
files = ["src/exostab"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["rebound.*", "astroquery.*", "astropy.*", "pyarrow.*", "plotly.*", "spock.*", "sklearn.*", "xgboost.*"]
ignore_missing_imports = true
