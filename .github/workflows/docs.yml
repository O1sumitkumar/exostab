name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Catalog page and downloads from the branch catalog-data (placeholder if it does not exist yet)
        run: |
          if git fetch --depth 1 origin catalog-data; then
            mkdir -p catalog-latest docs/data
            for f in catalog.csv catalog.parquet catalog_meta.json; do git show "FETCH_HEAD:$f" > "catalog-latest/$f"; done
            cp catalog-latest/* docs/data/
            python scripts/catalog_page.py catalog-latest
          else
            python scripts/catalog_page.py
          fi
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    # Enable after turning on GitHub Pages with "Source: GitHub Actions" and setting the repository variable
    # DEPLOY_DOCS=true (see README / final report for the steps).
    if: vars.DEPLOY_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
