name: Release

# Pushing a tag vX.Y.Z builds the package, tests the built wheel (fast suite and validation suite), publishes it
# to PyPI (only when enabled) and creates the GitHub release, which Zenodo archives. Setup and the release
# checklist: RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Tag, package version, CITATION.cff and CHANGELOG.md agree
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/exostab/__init__.py').read_text()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME}, but __version__ is $version"; exit 1; }
          grep -qxF "version: \"$version\"" CITATION.cff || { echo "::error::CITATION.cff does not give version \"$version\""; exit 1; }
          grep -qE '^date-released: "?[0-9]{4}-[0-9]{2}-[0-9]{2}"?$' CITATION.cff || { echo "::error::CITATION.cff has no date-released"; exit 1; }
          awk -v v="$version" '/^## /{p = (index($0, "[" v "]") > 0)} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section [$version]"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  test:
    # Nothing is published unless the fast suite and the CLI pass against the built wheel.
    needs: build
    name: wheel / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    env:
      EXOSTAB_OFFLINE: "1"  # tests use the bundled snapshot, never the network
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel with the test dependencies
        run: |
          wheel=$(ls dist/*.whl)
          python -m pip install "$wheel[dev]"
      - name: Ruff and mypy
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy
      - name: Tests against the installed wheel
        run: |
          python -c "import exostab; assert 'site-packages' in exostab.__file__, exostab.__file__"
          pytest
      - name: CLI smoke test
        run: |
          exostab --version
          exostab check "TOI-270" --offline --orbits 2000 --draws 3 --out smoke/
          test -f smoke/report.json && test -f smoke/orbits.png && test -f smoke/megno.png

  validation:
    # The slow validation suite (as in nightly.yml) must pass too: a version is not published while a
    # comparison with published results fails.
    needs: build
    name: validation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      EXOSTAB_OFFLINE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel with the test dependencies
        run: |
          wheel=$(ls dist/*.whl)
          python -m pip install "$wheel[dev]"
      - name: Validation suite against the installed wheel
        run: pytest -m slow -v

  pypi:
    needs: [build, test, validation]
    # Runs once the PyPI trusted publisher exists and the repository variable PUBLISH_PYPI is "true"
    # (RELEASING.md); until then releases are published on GitHub only.
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/exostab
    permissions:
      id-token: write  # PyPI trusted publishing (no API token stored anywhere)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, test, validation, pypi]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.test.result == 'success'
      && needs.validation.result == 'success' && needs.pypi.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creating the release also triggers the Zenodo archive once the integration is enabled
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "exostab $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
