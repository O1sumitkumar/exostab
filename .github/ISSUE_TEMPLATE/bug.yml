name: Bug report
description: Something does not work, crashes, or gives a result you believe is wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what did you get?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command and the full terminal output (report card or traceback).
      render: text
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: report.json (optional)
      description: If the problem is a scientific result, attach or paste report.json. It contains the seed, versions and data date needed to reproduce it.
  - type: input
    id: version
    attributes:
      label: exostab version
      description: Output of `exostab --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
