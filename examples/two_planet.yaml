# A made-up two-planet system showing every supported field. Units are part of the key names.
# A value is either a number or {value, err} / {value, err_plus, err_minus} / {value, upper_limit: true}.
name: Example two-planet system
epoch_jd: 2460000.0            # epoch of mean anomalies / mean longitudes (optional)
star:
  name: Example star
  mass_msun: {value: 1.00, err: 0.05}
planets:
  - name: Example b
    period_days: {value: 50.0, err: 0.01}
    mass_earth: {value: 30.0, err: 5.0}
    mass_kind: true                # true | minimum (m sin i) | estimated
    eccentricity: {value: 0.05, err: 0.03}
    omega_deg: {value: 90.0, err: 20.0}
    mean_longitude_deg: 0.0
  - name: Example c
    period_days: {value: 120.0, err: 0.05}
    mass_jupiter: {value: 0.5, err: 0.05}
    mass_kind: minimum
    eccentricity: {value: 0.10, upper_limit: true}
    # no omega_deg: drawn at random for every run
    transit_time_jd: {value: 2460010.5, err: 0.01}
